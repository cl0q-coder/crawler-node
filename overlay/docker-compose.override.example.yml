# Example compose override — copy to docker-compose.override.yml in the
# PRIVATE overlay repo and point env_file at the real (git-ignored) .env.
# This file shows the pattern only; values here are placeholders.
#
# The canonical repo's docker-compose.yml must run with placeholder env on
# its own. The overlay only injects real config — it never changes images
# (those come from the pinned canonical build).

services:
  website-crawler:
    env_file:
      - ./overlay/.env
    environment:
      # Example of a prod-only knob; canonical defaults stay untouched.
      - FRONTIER_REFRESH_S=300


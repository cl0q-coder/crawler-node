name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: CGO_ENABLED=0 go build ./...

  test-race:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1 # race detector requires cgo; be explicit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 ./...

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cl0q
          POSTGRES_PASSWORD: cl0q
          POSTGRES_DB: cl0q
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cl0q -d cl0q" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - run: psql "postgres://cl0q:cl0q@localhost:5432/cl0q" -v ON_ERROR_STOP=1 -f initdb/01-schema.sql

  # N1: Vendored-copy drift guard. Fails if botid/netguard/robotstxt
  # differ from the pinned commits in vendor-pins.txt.
  # GitHub-only: Gitea pins aren't reachable from GitHub Actions runners.
  # This check runs on the Gitea CI where the pins live.
  vendor-drift:
    runs-on: ubuntu-latest
    if: false # Gitea-only check; pins not reachable from GitHub Actions
    steps:
      - uses: actions/checkout@v4
      - name: check vendored copies match pins
        run: |
          while read -r pkg sha url; do
            [[ "$pkg" =~ ^#.*$ ]] && continue
            [ -z "$pkg" ] && continue
            # In CI the host-IP form of the pin URL isn't reachable from inside
            # the job container; the in-cluster address is. vendor-pins.txt keeps
            # the externally-usable URL for local `sync-vendor.sh`.
            url="${url/100.109.129.104:3420/gitea:3000}"
            echo "Checking $pkg @ $sha..."
            tmp=$(mktemp -d)
            git clone -q "$url" "$tmp/$pkg" || { echo "clone failed: $url"; exit 1; }
            (cd "$tmp/$pkg" && git checkout -q "$sha") || { echo "checkout failed: $sha not in $url"; exit 1; }
            # Compare only .go files (ignore .git, .github, docs)
            drift=0
            for f in "$pkg"/*.go; do
              base=$(basename "$f")
              if ! diff -q "$f" "$tmp/$pkg/$base" > /dev/null 2>&1; then
                echo "  Differ: $base"
                drift=1
              fi
            done
            if [ $drift -ne 0 ]; then
              echo "DRIFT DETECTED in $pkg: vendored copy differs from $sha"
              echo "Run ./sync-vendor.sh $pkg to update"
              exit 1
            fi
            rm -rf "$tmp"
            echo "  $pkg OK"
          done < vendor-pins.txt

  docker:
    runs-on: ubuntu-latest
    # GitHub-hosted runners have Docker pre-installed; no dind service needed.
    # (The dind service approach fails on GitHub with DNS resolution errors.)
    steps:
      - uses: actions/checkout@v4
      - name: compose file is valid
        run: CL0Q_NODE_ID=ci-node NODE_TOKEN=x DB_PASSWORD=x docker compose config --quiet
      - run: docker build -t cl0q-crawler-node:ci .

  # H5: Supply-chain hardening. The boring work that stops a SolarWinds.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # 1. govulncheck: fail on known vulnerabilities in dependencies
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      # 2. Verify dependencies are pinned and intact (no tampering)
      - name: verify modules
        run: |
          go mod verify
          test -f go.sum || { echo "go.sum missing"; exit 1; }
      # 3. go.mod/go.sum must be tidy: fail on ANY diff after tidy
      - name: tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      # 4. Real CycloneDX SBOM (not go list -m -json)
      - name: CycloneDX SBOM
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          cyclonedx-gomod mod -json -output sbom.cdx.json .
          test -s sbom.cdx.json
          echo "SBOM components: $(jq -r '.components | length' sbom.cdx.json)"
      - name: upload SBOM
        uses: actions/upload-artifact@v4
        continue-on-error: true # artifact store may be absent on a self-hosted runner; SBOM is built+checked above, upload is observability only
        with:
          name: sbom-cdx
          path: sbom.cdx.json

  timing:
    name: ci wall-time
    runs-on: ubuntu-latest
    needs: [test, test-race, schema, docker, supply-chain]
    if: always()
    permissions:
      contents: read
      actions: read
    steps:
      - name: report total CI wall time
        continue-on-error: true # observability only; never fail CI over the clock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          start_iso=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          start_s=$(date -u -d "$start_iso" +%s)
          elapsed=$(( $(date -u +%s) - start_s ))
          echo "total CI wall time: $(( elapsed / 60 ))m$(( elapsed % 60 ))s (run started $start_iso)"
